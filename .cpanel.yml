---
deployment:
  tasks:
    - export APPPATH=$HOME/quan89
    - cd $APPPATH && /usr/local/bin/php artisan migrate --force
    - cd $APPPATH && /usr/local/bin/php artisan db:seed --class=Menu89Seeder --force
    - cd $APPPATH && /usr/local/bin/php artisan db:seed --class=Blog89Seeder --force
    - cd $APPPATH && /usr/local/bin/php artisan optimize:clear
    - cd $APPPATH && /usr/local/bin/php artisan optimize
